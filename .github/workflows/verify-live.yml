name: Verify Live Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "Live site URL to verify"
        required: false
        default: "https://upgrade-ashen.vercel.app"

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_URL: ${{ inputs.url || 'https://upgrade-ashen.vercel.app' }}
    steps:
      # A16：釘死完整 commit SHA
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Wait for Vercel deployment to match main
        run: |
          set -euo pipefail
          BASE="${LIVE_URL%/}"
          FILES=(
            "index.html"
            "app.js"
            "data.js"
            "locale-en.js"
            "manifest.webmanifest"
            "icons/favicon.ico"
            "icons/favicon-16.png"
            "icons/favicon-32.png"
            "icons/apple-touch-icon.png"
            "icons/icon-192.png"
            "icons/icon-512.png"
            "icons/icon-maskable-192.png"
            "icons/icon-maskable-512.png"
            "icons/og-image.png"
          )

          for attempt in $(seq 1 24); do
            echo "Attempt ${attempt}/24 against ${BASE}"
            all_match=1
            for file in "${FILES[@]}"; do
              local_hash=$(sha256sum "${file}" | awk '{print $1}')
              remote_hash=$(curl -fsSL "${BASE}/${file}?check=${GITHUB_RUN_ID}-${attempt}" | sha256sum | awk '{print $1}' || true)
              if [ "${local_hash}" != "${remote_hash}" ]; then
                echo "Mismatch for ${file}: local=${local_hash} live=${remote_hash:-unreachable}"
                all_match=0
                break
              fi
            done

            if [ "${all_match}" -eq 1 ]; then
              echo "All core files and G11 icons on ${BASE} match main."
              exit 0
            fi

            sleep 15
          done

          echo "::error::Live site ${BASE} did not match main after 6 minutes."
          exit 1
